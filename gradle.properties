# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ── Optimizado para Celeron N4500 (2 cores, 16 GB RAM) ──

# Daemon JVM: 2.5 GB heap to leave enough space for Kotlin + Compose analysis.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=50 -Dfile.encoding=UTF-8 --add-opens=java.base/java.io=ALL-UNNAMED
kotlin.daemon.jvm.options=--add-opens=java.base/java.io=ALL-UNNAMED

# AndroidX
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# R class no-transitiva (reduce tamaño)
android.nonTransitiveRClass=true

# ── Build: secuencial para 2 cores (parallel crea overhead de hilos) ──
org.gradle.parallel=false
# Máximo 1 worker para evitar presión de memoria durante compilación Kotlin/Compose
org.gradle.workers.max=1

# ── Cache y compilación incremental ──
org.gradle.caching=true
kotlin.incremental=true
# KSP incremental desactivado: evita corrupción de cachés LZ4 con JDK 17+
ksp.incremental=false

# ── File-system watching: evita escaneos completos del filesystem ──
org.gradle.vfs.watch=true

# ── Kotlin daemon separado con más heap para Compose ──
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=50

# ── Daemon idle timeout: 10 min (libera 2 GB de RAM cuando no compilas) ──
org.gradle.daemon.idletimeout=600000

# ── Configuration cache: DESACTIVADO (incompatible con algunos plugins AGP/KSP) ──
# org.gradle.configuration-cache=true
# org.gradle.configuration-cache.problems=warn