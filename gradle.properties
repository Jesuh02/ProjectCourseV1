# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ── Optimizado para Celeron N4500 (2 cores, 16 GB RAM) ──

# Daemon JVM: 2 GB heap (más ligero, deja RAM para IDE y Kotlin daemon)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:G1HeapRegionSize=4m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# R class no-transitiva (reduce tamaño)
android.nonTransitiveRClass=true

# ── Build: secuencial para 2 cores (parallel crea overhead de hilos) ──
org.gradle.parallel=false
# Máximo 2 workers (= número de cores)
org.gradle.workers.max=2

# ── Cache y compilación incremental ──
org.gradle.caching=true
kotlin.incremental=true
ksp.incremental=true

# ── File-system watching: evita escaneos completos del filesystem ──
org.gradle.vfs.watch=true

# ── Kotlin daemon separado: su propio proceso, no compite con Gradle daemon ──
# (Eliminado in-process: era la causa principal de congelamiento)
kotlin.daemon.jvmargs=-Xmx1536m -XX:+UseG1GC

# ── Daemon idle timeout: 10 min (libera 2 GB de RAM cuando no compilas) ──
org.gradle.daemon.idletimeout=600000

# ── Configuration cache: DESACTIVADO (incompatible con algunos plugins AGP/KSP) ──
# org.gradle.configuration-cache=true
# org.gradle.configuration-cache.problems=warn